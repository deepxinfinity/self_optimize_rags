<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self-Optimizing RAG</title>
<style>
  :root{
    --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--border:#2a2f3a;--fg:#e6e9ef;--muted:#9aa4b2;
    --accent:#5b9dff;--good:#4ec9a5;--warn:#e0a458;--bad:#e05a5a;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f6f7f9;--panel:#fff;--panel2:#eef1f5;--border:#e0e3e8;--fg:#1a1d23;--muted:#5b6472;--accent:#2f6fed;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
  header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);}
  header h1{font-size:16px;margin:0;font-weight:650;}
  header .meta{color:var(--muted);font-size:12px;font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap;}
  .tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--border);background:var(--panel);}
  .tab{padding:8px 16px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font-weight:550;}
  .tab.active{background:var(--bg);color:var(--fg);border-color:var(--border);}
  main{padding:20px;max-width:1150px;margin:0 auto;}
  .hidden{display:none;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .muted{color:var(--muted);} .mono{font-family:var(--mono);} .best{color:var(--good);font-weight:700;}

  /* flow strip */
  .flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0 14px;margin-bottom:8px;}
  .step{min-width:150px;flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;position:relative;}
  .step .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;}
  .step .t{font-weight:600;margin:2px 0;}
  .step .d{font-size:11px;color:var(--muted);line-height:1.35;}
  .arrow{display:flex;align-items:center;color:var(--muted);padding:0 4px;font-size:18px;}
  .step.done{border-color:var(--good);} .step.done .n{color:var(--good);}

  /* controls */
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
  select,input,button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 9px;}
  label.f{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;}

  /* run cards */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .card>.head{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .card>.head:hover{background:var(--panel2);}
  .lbl{font-weight:600;} .desc{font-size:12px;color:var(--muted);margin-top:2px;max-width:640px;}
  .chip{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .dot.running{background:var(--warn);animation:pulse 1.2s infinite;} .dot.complete{background:var(--good);} .dot.incomplete{background:var(--muted);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .kpi{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;}
  .body{padding:0 14px 14px;border-top:1px solid var(--border);}
  table{border-collapse:collapse;width:100%;font-size:12px;font-family:var(--mono);margin-top:8px;}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--muted);font-weight:600;} .scroll{overflow-x:auto;}
  .sec{margin-top:12px;} .sec>.h{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .cmp .col{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;}
  svg{max-width:100%;height:auto;background:var(--panel2);border-radius:8px;}
  .legend{font-size:11px;color:var(--muted);}

  /* chat */
  #chat-log{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
  .msg{padding:10px 14px;border-radius:10px;max-width:90%;}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);}
  .sources{margin-top:8px;font-size:12px;} .src{border-left:2px solid var(--border);padding:2px 8px;margin:4px 0;color:var(--muted);}
  .timeline{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}
  .composer{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px;}
  input[type=text]{flex:1;} button.send{background:var(--accent);color:#fff;border:none;font-weight:600;cursor:pointer;} .spin{color:var(--muted);font-style:italic;}
</style>
</head>
<body>
<header>
  <h1>🔧 Self-Optimizing RAG</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<div class="tabs">
  <div class="tab active" data-tab="dash">Dashboard</div>
  <div class="tab" data-tab="chat">Chat</div>
</div>
<main>
  <section id="dash">
    <div class="sec"><div class="h">How the study works — each run below is one step of this pipeline</div></div>
    <div class="flow" id="flow"></div>

    <div class="controls">
      <label class="f">Dataset <select id="f-dataset"></select></label>
      <label class="f">Type
        <select id="f-kind">
          <option value="all">All</option><option value="optimize">Full optimization</option>
          <option value="stage1">Stage 1 · retrieval</option><option value="stage2">Stage 2 · prompts</option>
          <option value="eval">Evaluation</option>
        </select>
      </label>
      <label class="f">Sort
        <select id="f-sort"><option value="newest">Newest</option><option value="score">Best score</option></select>
      </label>
      <label class="f"><input type="checkbox" id="auto" checked> auto-refresh</label>
      <span class="muted" id="refresh-note" style="margin-left:auto;font-size:11px"></span>
    </div>
    <div id="runs"></div>
  </section>

  <section id="chat" class="hidden">
    <div class="row" style="margin-bottom:10px">
      <label class="muted" style="font-size:12px">Config:</label>
      <select id="source"><option value="baseline">Baseline (untuned)</option><option value="best">Best (latest optimize)</option></select>
      <input type="text" id="arm" placeholder="arm id (optional, for best)" style="max-width:220px">
      <span class="muted mono" id="chat-note"></span>
    </div>
    <div id="chat-log"></div>
    <div class="composer">
      <input type="text" id="q" placeholder="Ask a question about the corpus…" onkeydown="if(event.key==='Enter')send()">
      <button class="send" onclick="send()">Send</button>
    </div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const fmt=x=>(typeof x==='number')?x.toFixed(3):(x??'—');
const dsLabel=p=>p?p.replace(/\/+$/,'').split('/').pop():'unknown';
let SUMMARY=null, LAST=[], DS_INIT=false, AUTO_EXPANDED=false;

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  $('#dash').classList.toggle('hidden',t.dataset.tab!=='dash');
  $('#chat').classList.toggle('hidden',t.dataset.tab!=='chat');
});

// ---------- flow strip ----------
function renderFlow(kinds){
  const steps=[
    ['①','Corpus', SUMMARY?`${SUMMARY.n_docs} documents indexed`:'documents indexed', false],
    ['②','Synthetic eval', `2 arms (${SUMMARY?SUMMARY.arms.join(' vs '):'A vs B'}) write test questions`, kinds.has('gen')],
    ['③','Stage 1 · Retrieval', 'Tune chunking, top-k, reranker → best MRR', kinds.has('stage1')||kinds.has('optimize')],
    ['④','Stage 2 · Prompts', 'Tune the answer prompt → best faithfulness', kinds.has('stage2')||kinds.has('optimize')],
    ['⑤','Held-out eval', 'Score winners on the REAL questions', kinds.has('optimize')],
    ['⑥','Results', 'Does synthetic tuning transfer to real?', kinds.has('optimize')],
  ];
  $('#flow').innerHTML = steps.map((s,i)=>
    `<div class="step ${s[3]?'done':''}"><div class="n">${s[0]}</div><div class="t">${s[1]}</div><div class="d">${s[2]}</div></div>`
    + (i<steps.length-1?'<div class="arrow">→</div>':'')
  ).join('');
}

// ---------- tiny SVG charts ----------
function svgLine(values,{baseline=null,w=560,h=150,ylabel='value'}={}){
  if(!values.length) return '';
  const pad={l:34,r:10,t:10,b:20}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const ys=values.concat(baseline!=null?[baseline]:[]); let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mx-mn<1e-9){mn-=0.05;mx+=0.05;}
  const X=i=>pad.l+(values.length<2?iw/2:iw*i/(values.length-1));
  const Y=v=>pad.t+ih-ih*(v-mn)/(mx-mn);
  const best=Math.max(...values), bi=values.indexOf(best);
  const pts=values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  const dots=values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===bi?4:2.5}" fill="${i===bi?'var(--good)':'var(--accent)'}"/>`).join('');
  const base=baseline!=null?`<line x1="${pad.l}" y1="${Y(baseline)}" x2="${w-pad.r}" y2="${Y(baseline)}" stroke="var(--warn)" stroke-dasharray="4 3" stroke-width="1"/><text x="${w-pad.r}" y="${Y(baseline)-3}" text-anchor="end" font-size="9" fill="var(--warn)">baseline ${fmt(baseline)}</text>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" font-family="var(--mono)">
    <text x="4" y="${pad.t+6}" font-size="9" fill="var(--muted)">${fmt(mx)}</text>
    <text x="4" y="${h-pad.b}" font-size="9" fill="var(--muted)">${fmt(mn)}</text>
    <text x="${pad.l}" y="${h-4}" font-size="9" fill="var(--muted)">trial 1</text>
    <text x="${w-pad.r}" y="${h-4}" text-anchor="end" font-size="9" fill="var(--muted)">${values.length}</text>
    ${base}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${dots}
    <text x="${X(bi)}" y="${Y(best)-7}" text-anchor="middle" font-size="9" fill="var(--good)">best ${fmt(best)}</text>
  </svg>`;
}
function svgBars(values,{w=560,h=120}={}){
  if(!values.length) return ''; const pad={l:34,r:10,t:8,b:18}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const mx=Math.max(...values), bw=iw/values.length;
  const bars=values.map((v,i)=>{const bh=ih*v/(mx||1);return `<rect x="${pad.l+i*bw+1}" y="${pad.t+ih-bh}" width="${Math.max(1,bw-2)}" height="${bh}" fill="var(--accent)" opacity="0.75"/>`;}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" font-family="var(--mono)"><text x="4" y="${pad.t+6}" font-size="9" fill="var(--muted)">${mx.toFixed(0)}s</text>${bars}<text x="${pad.l}" y="${h-4}" font-size="9" fill="var(--muted)">time per trial (s)</text></svg>`;
}

// ---------- detail renderers ----------
function resultsTable(bc){
  const m=bc.headline_metric||'score';
  const arms=Object.entries(bc.arms||{}); const b=bc.baseline?.scores||{};
  let rows=`<tr><th>Setup</th><th title="score on the questions used to pick the config">Synthetic val</th><th title="held-out synthetic questions, scored once">Synthetic test</th><th title="REAL questions — the transfer result">Real held-out</th></tr>`;
  rows+=`<tr><td>Baseline (untuned)</td><td>—</td><td>${fmt(b.synthetic_test_mean)}</td><td>${fmt(b.real_heldout)}</td></tr>`;
  for(const [a,v] of arms) rows+=`<tr><td>Optimized — ${a}</td><td>${fmt(v.scores.synthetic_val)}</td><td>${fmt(v.scores.synthetic_test)}</td><td class="best">${fmt(v.scores.real_heldout)}</td></tr>`;
  return `<div class="sec"><div class="h">Results — headline metric: <b>${m}</b> (higher = better). The <b>Real held-out</b> column is the finding.</div><div class="scroll"><table>${rows}</table></div></div>`;
}
function compareArms(bc){
  const arms=Object.entries(bc.arms||{}); if(arms.length<2) return '';
  const col=([a,v])=>{const r=v.best_config.retrieval;return `<div class="col"><b>${a}</b> <span class="muted">(${v.model||''})</span>
    <div style="margin-top:6px">real held-out: <b class="best">${fmt(v.scores.real_heldout)}</b> · synth test: ${fmt(v.scores.synthetic_test)} · val: ${fmt(v.scores.synthetic_val)}</div>
    <div class="mono muted" style="margin-top:6px">chunk ${r.chunk_size}/${r.chunk_overlap} · top_k ${r.top_k} · alpha ${fmt(r.hybrid_alpha)} · reranker ${r.use_reranker}</div>
    <div style="margin-top:4px">stage1 ${fmt(v.stage1.baseline)}→${fmt(v.stage1.best)} · stage2 ${fmt(v.stage2.seed)}→${fmt(v.stage2.best)}</div></div>`;};
  return `<div class="sec"><div class="h">Compare arms — which eval-generator produced better-transferring configs?</div><div class="cmp">${arms.map(col).join('')}</div></div>`;
}
function chartBlock(rows){
  if(!rows||!rows.length) return '<div class="muted" style="margin-top:8px">no trials logged yet…</div>';
  const vals=rows.map(r=>r.value), times=rows.map(r=>r.time_sec||0);
  const isS2='prompt' in rows[0];
  let html=`<div class="sec"><div class="h">${isS2?'Faithfulness':'MRR'} per trial — each point is one config tried</div>${svgLine(vals,{})}</div>`;
  html+=`<div class="sec"><div class="h">Time per trial — cost of each config (reranker/embedding shows up here)</div>${svgBars(times,{})}</div>`;
  // table
  const best=Math.max(...vals);
  let head=isS2?`<tr><th>#</th><th>${rows[0].metric||'value'}</th><th>time_s</th><th>prompt</th></tr>`
    :`<tr><th>#</th><th>value</th><th>time_s</th><th>chunk</th><th>top_k</th><th>alpha</th><th>rerank</th></tr>`;
  const body=rows.map(r=>{const c=r.value===best?'best':''; if(isS2) return `<tr class="${c}"><td>${r.trial}</td><td>${fmt(r.value)}</td><td>${fmt(r.time_sec)}</td><td>${(r.prompt||'').slice(0,70).replace(/</g,'&lt;')}…</td></tr>`;
    const p=r.params||{};return `<tr class="${c}"><td>${r.trial}</td><td>${fmt(r.value)}</td><td>${fmt(r.time_sec)}</td><td>${p.chunk_size}/${p.chunk_overlap}</td><td>${p.top_k}</td><td>${fmt(p.hybrid_alpha)}</td><td>${p.use_reranker}</td></tr>`;}).join('');
  html+=`<div class="sec"><div class="h">All configs tried</div><div class="scroll"><table>${head}${body}</table></div></div>`;
  return html;
}

async function toggleRun(name,el){
  const b=el.querySelector('.body'); if(b){b.remove();return;}
  const d=await(await fetch('/api/runs/'+name)).json();
  const div=document.createElement('div'); div.className='body'; let html='';
  if(d.best_configs){ html+=resultsTable(d.best_configs)+compareArms(d.best_configs); }
  // one chart block per trial log (optimize has several: <arm>_stage1, <arm>_stage2, …)
  const logs=Object.entries(d.trials||{}).filter(([k,v])=>v&&v.length)
    .sort((a,b)=>a[0].localeCompare(b[0]));
  for(const [k,rows] of logs){
    const nice=k.replace(/_trials$/,'').replace(/_/g,' · ');
    html+=`<div class="sec"><div class="h" style="text-transform:capitalize">▸ ${nice} (${rows.length} trials)</div></div>`+chartBlock(rows);
  }
  if(d.timings){ html+=`<div class="sec"><div class="h">Step timings</div><div class="scroll"><table>${d.timings.steps.map(s=>`<tr><td>${fmt(s.seconds)}s</td><td>${s.label}</td></tr>`).join('')}<tr><td class="best">${fmt(d.timings.total_seconds)}s</td><td>total</td></tr></table></div></div>`; }
  div.innerHTML=html||'<div class="muted" style="padding:8px 0">running… results appear here when a stage completes.</div>';
  el.appendChild(div);
}

function optProgress(p){   // {arm:{stage1:n,stage2:n}} -> "local_qg S1·20 S2·3 | frontier —"
  const arms=Object.entries(p||{});
  if(!arms.length) return 'starting…';
  return arms.map(([a,st])=>`${a} S1·${st.stage1||0}${st.stage2?` S2·${st.stage2}`:''}`).join(' | ');
}
function kpiFor(r){
  const s=r.summary||{};
  if(r.kind==='optimize') return s.complete===false?optProgress(s.progress):`headline ${s.headline_metric}`;
  if(r.status==='incomplete') return '<span class="muted">aborted / no result</span>';
  if(r.kind==='stage1') return s.metric?`${s.metric} ${fmt(s.baseline_value)}→<span class="best">${fmt(s.best_value)}</span>`:'—';
  if(r.kind==='stage2') return s.metric?`${s.metric} ${fmt(s.seed_value)}→<span class="best">${fmt(s.best_value)}</span>`:'—';
  if(r.kind==='eval'&&s.retrieval) return `mrr ${fmt(s.retrieval.mrr)}`;
  return '';
}

function applyAndRender(){
  const dsF=$('#f-dataset').value, kF=$('#f-kind').value, sortF=$('#f-sort').value;
  let runs=LAST.filter(r=>(dsF==='all'||(r.dataset||'unknown')===dsF)&&(kF==='all'||r.kind===kF));
  if(sortF==='score') runs=runs.slice().sort((a,b)=>(scoreOf(b))-(scoreOf(a)));
  const box=$('#runs');
  const open=new Set([...box.querySelectorAll('.card')].filter(c=>c.querySelector('.body')).map(c=>c.dataset.name));
  box.innerHTML=runs.map(r=>`
    <div class="card" data-name="${r.name}" data-status="${r.status}">
      <div class="head">
        <div>
          <div class="lbl"><span class="dot ${r.status}"></span>${r.label}</div>
          <div class="desc">${r.description||''}</div>
          <div class="row" style="margin-top:6px">
            <span class="chip">${dsLabel(r.dataset)}</span>
            <span class="chip">${r.status}</span>
            <span class="muted mono" style="font-size:11px">${r.timestamp}</span>
          </div>
        </div>
        <div class="kpi">${kpiFor(r)}</div>
      </div>
    </div>`).join('') || '<div class="muted">no runs for this filter.</div>';
  box.querySelectorAll('.card').forEach(c=>{ c.querySelector('.head').onclick=()=>toggleRun(c.dataset.name,c);
    if(open.has(c.dataset.name)) c.querySelector('.head').click(); });
  // auto-expand the newest running run, once
  if(!AUTO_EXPANDED){ const act=[...box.querySelectorAll('.card')].find(c=>c.dataset.status==='running');
    if(act){ act.querySelector('.head').click(); AUTO_EXPANDED=true; } }
}
function scoreOf(r){const s=r.summary||{}; return s.best_value ?? (s.arms?Math.max(...Object.values(s.arms).map(x=>x.real_heldout||0)):0);}

async function loadRuns(){
  const data=await(await fetch('/api/runs')).json();
  LAST=data.runs||[];
  // dataset dropdown (once)
  if(!DS_INIT){
    const sets=[...new Set(LAST.map(r=>r.dataset||'unknown'))];
    $('#f-dataset').innerHTML=`<option value="all">All datasets</option>`+sets.map(s=>`<option value="${s}">${dsLabel(s)}</option>`).join('');
    const cur=data.current_dataset; if(sets.includes(cur)) $('#f-dataset').value=cur;   // default: current dataset only
    DS_INIT=true;
  }
  renderFlow(new Set(LAST.map(r=>r.kind)));
  applyAndRender();
  $('#refresh-note').textContent='updated '+new Date().toLocaleTimeString();
}
['f-dataset','f-kind','f-sort'].forEach(id=>$('#'+id).addEventListener('change',applyAndRender));

async function loadSummary(){
  SUMMARY=await(await fetch('/api/summary')).json();
  $('#meta').innerHTML=[`config: ${SUMMARY.config}`,`corpus: ${SUMMARY.n_docs} docs`,`arms: ${SUMMARY.arms.join(', ')}`,`gen: ${SUMMARY.generator}`,`judge: ${SUMMARY.judge}`].map(x=>`<span>${x}</span>`).join('');
}

// ---------- chat ----------
function addMsg(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;$('#chat-log').appendChild(d);d.scrollIntoView();return d;}
async function send(){
  const q=$('#q').value.trim(); if(!q) return; $('#q').value=''; addMsg('user',q.replace(/</g,'&lt;'));
  const wait=addMsg('bot','<span class="spin">thinking… (first question builds the index)</span>');
  try{ const res=await(await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:q,source:$('#source').value,arm:$('#arm').value||null})})).json();
    const src=(res.sources||[]).map(s=>`<div class="src">[${fmt(s.score)}] <b>${s.doc_id}</b> · ${s.chunk_id}<br>${(s.text||'').replace(/</g,'&lt;')}</div>`).join('');
    const tl=(res.timings||[]).map(t=>`${t.label} ${t.seconds}s`).join(' · ');
    $('#chat-note').textContent=res.config_note||'';
    wait.innerHTML=`${(res.answer||'').replace(/</g,'&lt;')}<div class="sources">${src}</div><div class="timeline">${tl} · total ${fmt(res.total_seconds)}s</div>`;
  }catch(e){ wait.innerHTML='<span style="color:var(--bad)">error: '+e+'</span>'; }
}

loadSummary().then(loadRuns);
setInterval(()=>{ if($('#auto').checked && !$('#dash').classList.contains('hidden')) loadRuns(); },4000);
</script>
</body>
</html>
